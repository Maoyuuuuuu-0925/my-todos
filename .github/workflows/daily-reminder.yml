name: daily-todo-reminder

on:
  schedule:
    - cron: '1 6 * * *'    # UTC 06:01 = 北京时间 14:01
    - cron: '1 12 * * *'   # UTC 12:01 = 北京时间 20:01
    - cron: '1 14 * * *'   # UTC 14:01 = 北京时间 22:01（原 12 15 * * * 实为北京时间 23:12 / 美东夏令时 11:12）
    - cron: '0 1 * * 1'    # 周报：UTC 周一 01:00 = 北京时间周一 09:00
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to WeCom
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          TZ: Asia/Shanghai
        run: |
          python3 - <<'PY'
          import json, os, random, urllib.request
          from datetime import date, datetime, timedelta

          GREETINGS = [
              "下午/晚上好，Angela",
              "Angela，有新的想法吗？",
              "很高兴为你播报，Angela",
          ]

          def parse_date(s):
              if not s:
                  return None
              try:
                  return datetime.strptime(s, '%Y-%m-%d').date()
              except ValueError:
                  return None

          def send(content):
              data = json.dumps({
                  "msgtype": "text",
                  "text": {"content": content}
              }).encode('utf-8')
              req = urllib.request.Request(
                  os.environ['WEBHOOK_URL'],
                  data=data,
                  headers={'Content-Type': 'application/json'}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print("WeCom response:", resp.status, resp.read().decode('utf-8', errors='ignore'))

          with open('todos.json', encoding='utf-8') as f:
              todos = json.load(f)

          for t in todos:
              t.setdefault('status', 'todo')
              t['_date'] = parse_date(t.get('date'))

          today = date.today()
          is_weekly = (
              os.environ.get('EVENT_NAME') == 'schedule'
              and os.environ.get('SCHEDULE', '').strip() == '0 1 * * 1'
          )

          if is_weekly:
              done_items = [t for t in todos if t['status'] == 'done']
              todo_items = [t for t in todos if t['status'] != 'done']
              week_ago = today - timedelta(days=7)
              done_this_week = [
                  t for t in done_items
                  if t['_date'] and week_ago <= t['_date'] <= today
              ]
              overdue = sorted(
                  [t for t in todo_items if t['_date'] and t['_date'] < today],
                  key=lambda t: t['_date']
              )
              upcoming = sorted(
                  [t for t in todo_items
                   if t['_date'] and today <= t['_date'] <= today + timedelta(days=7)],
                  key=lambda t: t['_date']
              )

              lines = [
                  "📊 本周周报，Angela",
                  "",
                  f"📝 当前待办：{len(todo_items)} 项",
                  f"✅ 当前已完成：{len(done_items)} 项",
                  f"🎯 过去7天（按计划日期）完成：{len(done_this_week)} 项",
              ]
              if overdue:
                  lines += ["", "⚠️ 逾期待办："]
                  for t in overdue:
                      lines.append(f"- {t['title']}（{t['date']}）")
              if upcoming:
                  lines += ["", "📅 未来7天待办："]
                  for t in upcoming:
                      lines.append(f"- {t['title']}（{t['date']}）")
              send("\n".join(lines))

          else:
              todo_items = sorted(
                  [t for t in todos if t['status'] != 'done'],
                  key=lambda t: t['_date'] or date(9999, 12, 31)
              )
              total = len(todos)
              done_count = sum(1 for t in todos if t['status'] == 'done')
              todo_count = total - done_count

              greeting = random.choice(GREETINGS)
              lines = [greeting, "", "📋 今日待办："]
              if todo_items:
                  for t in todo_items:
                      lines.append(f"- {t['title']}（{t.get('date', '')}）")
              else:
                  lines.append("- （暂无待办，休息一下吧）")
              lines += ["", f"✅ 已完成 {done_count}/{total} 项，剩余 {todo_count} 项待办"]
              send("\n".join(lines))
          PY
