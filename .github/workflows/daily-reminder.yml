name: daily-todo-reminder

on:
  schedule:
    - cron: '0 6 * * *'    # UTC 6点  = 北京时间 14:00
    - cron: '0 12 * * *'   # UTC 12点 = 北京时间 20:00
    - cron: '0 14 * * *'   # UTC 14点 = 北京时间 22:00
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push todos to WeCom
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json, os, random, urllib.request

          GREETINGS = [
              "下午/晚上好，Angela",
              "Angela，有新的想法吗？",
              "很高兴为你播报，Angela",
          ]

          with open('todos.json', encoding='utf-8') as f:
              todos = json.load(f)

          # 按日期升序：日期越近越靠前；没有日期的排最后
          todos.sort(key=lambda t: t.get('date') or '9999-99-99')

          greeting = random.choice(GREETINGS)
          lines = [greeting, "", "📋 今日待办："]
          for t in todos:
              lines.append(f"- {t['title']}（{t.get('date', '')}）")

          content = "\n".join(lines)
          data = json.dumps({
              "msgtype": "text",
              "text": {"content": content}
          }).encode('utf-8')

          req = urllib.request.Request(
              os.environ['WEBHOOK_URL'],
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          urllib.request.urlopen(req)
          PY
